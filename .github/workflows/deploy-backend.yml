name: Deploy Backend to EC2

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'apps/backend/Dockerfile'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: amala-backend
  DOCKERFILE_PATH: apps/backend/Dockerfile

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f ${{ env.DOCKERFILE_PATH }} -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy to EC2 via SSM
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Create deployment script
          DEPLOY_COMMAND=$(cat << 'DEPLOY_SCRIPT'
          #!/bin/bash
          set -e

          # Login to ECR
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin $ECR_REGISTRY

          # Pull latest image
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:latest

          # Stop and remove old container
          docker stop amala-backend || true
          docker rm amala-backend || true

          # Run new container
          docker run -d \
            --name amala-backend \
            --restart unless-stopped \
            -p 3001:3001 \
            -e NODE_ENV=production \
            -e PORT=3001 \
            -e AWS_REGION=$AWS_REGION \
            -e DYNAMODB_TABLE_NAME=$DYNAMODB_TABLE_NAME \
            -e AWS_S3_THUMBNAILS_BUCKET=$AWS_S3_THUMBNAILS_BUCKET \
            -e COGNITO_USER_POOL_ID=$COGNITO_USER_POOL_ID \
            -e COGNITO_CLIENT_ID=$COGNITO_CLIENT_ID \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest

          # Clean up old images
          docker image prune -af --filter "until=168h"
          DEPLOY_SCRIPT
          )

          # Send command via SSM
          aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[$DEPLOY_COMMAND]" \
            --region ${{ env.AWS_REGION }} \
            --output text \
            --query "Command.CommandId" > command-id.txt

          # Wait for command to complete
          COMMAND_ID=$(cat command-id.txt)
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region ${{ env.AWS_REGION }}

          # Get command output
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region ${{ env.AWS_REGION }}
