name: Deploy Backend to EC2

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'apps/backend/Dockerfile'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: amala-backend
  DOCKERFILE_PATH: apps/backend/Dockerfile

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f ${{ env.DOCKERFILE_PATH }} -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy to EC2 via SSM
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          AWS_REGION: ${{ env.AWS_REGION }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          DYNAMODB_TABLE_NAME: ${{ secrets.DYNAMODB_TABLE_NAME }}
          AWS_S3_THUMBNAILS_BUCKET: ${{ secrets.AWS_S3_THUMBNAILS_BUCKET }}
          COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
          COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
        run: |
          # Build JSON parameters using jq
          PARAMETERS=$(jq -n \
            --arg region "$AWS_REGION" \
            --arg registry "$ECR_REGISTRY" \
            --arg repo "$ECR_REPOSITORY" \
            --arg db "$DYNAMODB_TABLE_NAME" \
            --arg bucket "$AWS_S3_THUMBNAILS_BUCKET" \
            --arg pool "$COGNITO_USER_POOL_ID" \
            --arg client "$COGNITO_CLIENT_ID" \
            '{
              "commands": [
                "set -e",
                "aws ecr get-login-password --region \($region) | docker login --username AWS --password-stdin \($registry)",
                "docker pull \($registry)/\($repo):latest",
                "docker stop amala-backend || true",
                "docker rm amala-backend || true",
                "docker run -d --name amala-backend --restart unless-stopped -p 3001:3001 -e NODE_ENV=production -e PORT=3001 -e AWS_REGION=\($region) -e DYNAMODB_TABLE_NAME=\($db) -e AWS_S3_THUMBNAILS_BUCKET=\($bucket) -e COGNITO_USER_POOL_ID=\($pool) -e COGNITO_CLIENT_ID=\($client) \($registry)/\($repo):latest",
                "docker image prune -af --filter \"until=168h\""
              ]
            }')

          # Send command via SSM
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --region "$AWS_REGION" \
            --output text \
            --query "Command.CommandId")

          # Wait for command to complete
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"

          # Get command output
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"
